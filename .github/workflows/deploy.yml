name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the deploy job assume an AWS role through OIDC

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  aws-config:
    name: Check AWS configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if [ -n "$ROLE_ARN" ] && [ -n "$STATE_BUCKET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: set AWS_DEPLOY_ROLE_ARN and TF_STATE_BUCKET repository secrets to enable it."
          fi

  deploy:
    name: Deploy to AWS
    # Releases only go out after the JUnit tests, Terraform validation, and
    # Docker build in the CI workflow have all passed.
    needs: [ci, aws-config]
    if: needs.aws-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ENVIRONMENT: ${{ vars.PULSE_ENVIRONMENT || 'dev' }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package email Lambda
        working-directory: .
        run: ./scripts/build-lambda.sh

      - name: Terraform init
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=pulse/$ENVIRONMENT.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Create ECR repository
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.app \
            -var="aws_region=$AWS_REGION" -var="environment=$ENVIRONMENT"

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          REPO_NAME="pulse-$ENVIRONMENT-api"
          REPO_URL=$(aws ecr describe-repositories --repository-names "$REPO_NAME" \
            --query 'repositories[0].repositoryUri' --output text)
          # Tags are immutable, so a re-run of the same commit reuses its image.
          if aws ecr describe-images --repository-name "$REPO_NAME" \
              --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            echo "Image $GITHUB_SHA already in ECR, skipping build."
          else
            docker build -t "$REPO_URL:$GITHUB_SHA" ..
            docker push "$REPO_URL:$GITHUB_SHA"
          fi

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=$AWS_REGION" -var="environment=$ENVIRONMENT" \
            -var="image_tag=$GITHUB_SHA"

      - name: Wait for ECS rollout
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 "$(terraform output -raw api_url)/actuator/health"
